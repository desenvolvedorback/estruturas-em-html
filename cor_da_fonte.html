<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cor da fonte</title>
</head>

<body>
    <!-- 
     há 3 sintaxes para definir a cor do texto:
        <font color="#XXXXXX">Texto (hexadecimal) </font>
        <font color="rgb(255,0,0)">Texto (valores RGB) </font>
        <font color="red">Texto (nome da cor) </font>
    -->

    <font color="#FF0000">Texto em vermelho (hexadecimal)</font><br>
    <font color="rgb(0,200,0)">Texto em verde (valores RGB)</font><br>
    <font color="blue">Texto em azul (nome da cor)</font><br>
</body>

</html>

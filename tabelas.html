<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        thead {
            background-color: #fdfcfc;
            color: #000000;
        }

        th {
            background-color: #d1f550;
        }

        tfoot {
            background-color: #d1f550;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!--
    <table> o elemento principal que envolve toda tabela
        <thead>, <tbody>, <tfoot>- define cabeçalho, corpo e rodapé da tabela
            <tr> - define uma linha da tabela
                <th> - define uma célula de cabeçalho da tabela
                <td> - define uma célula comum de dados da tabela
    -->

    <h2>Lista de Materiais e Preços</h2>
                <table>
                    <!-- Cabeçalho da tabela -->
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Item</th>
                            <th>Quantidade</th>
                            <th>Valor Unitário</th>
                        </tr>
                    </thead>
                    <!-- Corpo da tabela (dados) -->
                    <tbody>
                        <tr>
                            <td>#001</td>
                            <td>Cabo flexível 2,5m (100m)</td>
                            <td>5</td>
                            <td>R$ 180,00</td>
                        </tr>
                        <tr>
                            <td>#002</td>
                            <td>Disjuntor Bibolar (20A)</td>
                            <td>12</td>
                            <td>R$ 35,00</td>
                        </tr>
                        <tr>
                            <td>#003</td>
                            <td>Quandro de distribuição (12x12)</td>
                            <td>7</td>
                            <td>R$ 95,00</td>
                        </tr>
                    </tbody>
                    <!-- Rodapé da pagina (totais/resumo)-->
                     <tfoot>
                        <!-- conlspan une colunas, rowspan une linhas-->
                        <tr>
                            <td colspan="2">Total de Itens : 3</td>
                            <td colspan="1">24</td>
                            <td colspan="3">Valor Total : R$ 1.085,00</td>
                        </tr>
                     </tfoot>
                </table>
</body>
</html>
